[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tsumugi-genres"
version = "0.1.0"
description = "Genres of whole songs (135 genres, several per song) from SheetSage2-Refined's encoder"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "anime-song" }]
keywords = ["music genre classification", "multi-label", "music tagging"]
dependencies = [
    "torch>=2.8",
    "torchaudio>=2.8",
    "numpy",
    "safetensors>=0.4",
    "soundfile>=0.12",
    "huggingface_hub[hf_xet]>=0.30",
    "sheetsage2-refined @ git+https://github.com/anime-song/SheetSage2-Refined",
]

[project.urls]
"Model" = "https://huggingface.co/anime-song/Tsumugi-Genres"
"Source" = "https://github.com/anime-song/Tsumugi-Genres"

[project.scripts]
tsumugi-genres = "tsumugi_genres.__main__:main"

[tool.setuptools]
packages = ["tsumugi_genres"]
